# kitty.conf generated by Confitty on 2026-05-27
# Place this file at: ~/.config/kitty/kitty.conf
# Reload without restart: Ctrl+Shift+F5  |  Docs: https://sw.kovidgoyal.net/kitty/conf/
# Only settings that differ from Kitty defaults are included.

# --- Startup ---
startup_session startup.session

# --- Fonts ---
font_family      family="FiraCode Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12
disable_ligatures cursor

# --- Cursor ---
cursor_shape beam
cursor_blink_interval 0

# --- Scrollback ---
scrollback_lines 10000

# --- Mouse ---
copy_on_select clipboard

# --- Bell ---
enable_audio_bell no

# --- Window Layout ---
window_border_width 1pt
window_padding_width 8 8 8 16
inactive_text_alpha 0.7
confirm_os_window_close 0
enabled_layouts tall,stack,fat

# --- Tab Bar ---
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# --- Theme ---
include nightfox-blurred.conf

# --- Advanced ---
close_on_child_death no
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# --- OS Specific ---
macos_quit_when_last_window_closed yes
macos_option_as_alt yes
macos_titlebar_color background


